version: "3.9"

services:
  devopsdb:
    image: monukumardh/oct:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 2
    networks:
      - mynetwork

  application:
    image: monukumardh/oct:javaapp
    ports:
      - "2222:8080"
    deploy:
      replicas: 2
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
